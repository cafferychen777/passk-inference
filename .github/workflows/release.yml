name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'cafferychen777/passk-inference'
    uses: ./.github/workflows/ci.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Match tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, runpy
          version = runpy.run_path('passk_inference/_version.py')['__version__']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Stable versions only'
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and package version differ'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python scripts/check_sdist.py dist/*.tar.gz
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python scripts/export_release.py
      - name: Record distribution checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(path for path in Path('dist').iterdir() if path.is_file())
          Path('dist/SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in files))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/passk-inference/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - run: |
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish/
          skip-existing: true
  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - run: python scripts/verify_pypi.py "$VERSION"
      - name: Install the public wheel and reproduce the paper result
        run: |
          python -m venv /tmp/pypi-check
          /tmp/pypi-check/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "passk-inference[report]==$VERSION"
          cp -R examples /tmp/passk-pypi-examples
          cd /tmp
          /tmp/pypi-check/bin/python -c 'import os, passk_inference; assert passk_inference.__version__ == os.environ["VERSION"]; print(passk_inference.__file__)'
          /tmp/pypi-check/bin/python -m passk_inference --version
          /tmp/pypi-check/bin/python /tmp/passk-pypi-examples/deepscaler32k/reproduce.py
  github-release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - name: Create release and attach the verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
